<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Provider Portal - Login</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header><h1>State Medicaid Provider Portal (Demo)</h1></header>
  <main>
    <h2>Sign In</h2>
    <div id="loginError" class="alert hidden" role="alert">Invalid username or password.</div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />
      </div>
      <button type="submit">Sign In</button>
    </form>
    <p style="font-size:13px;color:#52606d">Demo credentials: provider.admin / Welcome@123</p>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      if (u === 'provider.admin' && p === 'Welcome@123') {
        sessionStorage.setItem('user', u);
        location.href = '/dashboard.html';
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
